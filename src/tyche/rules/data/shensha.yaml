# 神煞 tables (external). Each entry:
#   anchor: gan | zhi        derive from the stem / branch
#   reference: taiji | year | day
#       taiji = use the 太极点 pillar (子平 -> day, 禄命星命 -> year) for the anchor; switches with ChartConfig
#       year/day = always use that pillar (does not follow the 太极点; e.g. 孤辰/寡宿 always anchor on the year branch)
#   table: anchor value -> list of target 地支 to match; checked against the four pillars' branches
#   kind: table (default lookup) | xunkong (空亡, via the 旬 algorithm)
#
# School note: 神煞 conventions vary widely; the common reading is used here, kept in external
# YAML so it can be changed/extended per school. Most 神煞 use reference=taiji (the 太极点 realised
# at the 神煞 layer); 孤辰/寡宿 are fixed to year to show that some 神煞 do not follow it.

天乙贵人:
  anchor: gan
  reference: taiji
  desc: 第一吉神,逢凶化吉
  table:
    甲: [丑, 未]
    戊: [丑, 未]
    庚: [丑, 未]
    乙: [子, 申]
    己: [子, 申]
    丙: [亥, 酉]
    丁: [亥, 酉]
    壬: [卯, 巳]
    癸: [卯, 巳]
    辛: [午, 寅]

